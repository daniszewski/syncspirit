name: Build Syncspirit

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest] #, macos-latest]
        build_type: [Release]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-24.04-arm
            c_compiler: gcc
            cpp_compiler: g++
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Conan
      uses: conan-io/setup-conan@v1
      with:
        conan-version: '2.x'

    - name: Install Linux Dependencies (FLTK, OpenGL, etc.)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libfontconfig1-dev libssl-dev

    - name: Configure CMake with Conan
      run: |
        mkdir build && cd build
        conan install .. --build=missing -s build_type=${{ matrix.build_type }} -s compiler.cppstd=20 -s:b compiler.cppstd=20 -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake
      shell: bash

    - name: Build
      run: |
        cd build
        cmake --build . --config ${{ matrix.build_type }} -j 4

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: syncspirit-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          build/src/**/syncspirit*
          build/**/syncspirit*
        if-no-files-found: warn
